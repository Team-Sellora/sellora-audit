# Local audit_db with the real roles. Kafka comes from sellora-infra's
# docker-compose (localhost:9092), the same broker the other services use.
services:
  audit-db:
    image: postgres:16-alpine
    container_name: audit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: audit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_pw}
      AUDIT_OWNER_PASSWORD: ${AUDIT_OWNER_PASSWORD:-audit_owner_dev_pw}
      AUDIT_APP_PASSWORD: ${AUDIT_APP_PASSWORD:-audit_app_dev_pw}
    ports:
      - "5438:5432"
    volumes:
      - audit-db-data:/var/lib/postgresql/data
      - ./scripts/create-db-roles.sql:/scripts/create-db-roles.sql:ro
      - ./scripts/init-local-db.sh:/docker-entrypoint-initdb.d/10-create-db-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - sellora-network

networks:
  sellora-network:
    driver: bridge

volumes:
  audit-db-data:
