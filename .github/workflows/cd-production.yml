name: CD - Deploy Production

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-production-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Deploy Audit to Azure production
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - name: Validate production configuration
        shell: bash
        env:
          APP_NAME: ${{ vars.AZURE_PRODUCTION_APP_NAME }}
          BASE_URL: ${{ vars.AZURE_PRODUCTION_BASE_URL }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [ -z "$APP_NAME" ] || [ -z "$BASE_URL" ] || [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "Configure AZURE_PRODUCTION_APP_NAME, AZURE_PRODUCTION_BASE_URL, and DOCKERHUB_USERNAME."
            exit 1
          fi
          if [[ "$BASE_URL" != https://* ]]; then
            echo "AZURE_PRODUCTION_BASE_URL must start with https://"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          build-args: BUILD_COMMIT_SHA=${{ github.sha }}
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/sellora-audit:prod-${{ github.sha }}
            ${{ vars.DOCKERHUB_USERNAME }}/sellora-audit:latest

      - name: Deploy production image
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_PRODUCTION_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_PRODUCTION_PUBLISH_PROFILE }}
          images: index.docker.io/${{ vars.DOCKERHUB_USERNAME }}/sellora-audit:prod-${{ github.sha }}

      - name: Validate production startup
        shell: bash
        env:
          BASE_URL: ${{ vars.AZURE_PRODUCTION_BASE_URL }}
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            status=$(curl --silent --location --output /dev/null --write-out "%{http_code}" "${BASE_URL%/}/health" || true)
            if [ "$status" = "200" ]; then
              echo "Production startup validation passed."
              exit 0
            fi
            echo "Attempt $attempt: /health returned ${status:-no response}; retrying..."
            sleep 15
          done
          echo "Production deployment failed health validation."
          exit 1
