name: Selenium UI tests (Audit)

on:
  push:
    branches:
      - test/selenium-audit
  workflow_dispatch:

jobs:
  selenium:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_URL: http://test.selloralk.tech
      TEST_USER: ${{ secrets.SELLORA_TEST_USER }}
      TEST_PASSWORD: ${{ secrets.SELLORA_TEST_PASSWORD }}
    defaults:
      run:
        working-directory: selenium-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Selenium tests
        run: pytest --html=reports/report.html --self-contained-html --junitxml=reports/junit.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-audit-report
          path: selenium-tests/reports/
